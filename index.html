<!doctype html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A"><title>Stock</title>
<style>
:root{--n:#0B1F3A;--g:#D4AF37;--bg:#F3F1EA;--t:#1a1a1a;--r:#B3261E}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--n);color:var(--g);padding:14px;font-weight:700;position:sticky;top:0}
main{padding:12px;max-width:520px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--n);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:#9fb0c8;font-size:15px}nav .on{color:var(--g);font-weight:700}
input,select{width:100%;padding:12px;margin:4px 0 10px;border:1px solid #bbb;border-radius:8px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.p{padding:12px 8px;border:1px solid var(--n);border-radius:10px;background:#fff;text-align:left;font-size:15px}
.p small{display:block;color:#666}.p.low small{color:var(--r);font-weight:700}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row b{flex:2}.row input{margin:0;flex:1;padding:8px}
.go{width:100%;padding:14px;background:var(--n);color:var(--g);border:0;border-radius:10px;font-size:17px;font-weight:700}
.st{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd}.st.low span:last-child{color:var(--r);font-weight:700}
h3{margin:8px 0}.tot{font-size:20px;font-weight:700;margin:8px 0}
</style></head><body>
<header id="hd">Stock</header><main id="m">Loading...</main>
<nav id="nv"></nav>
<script>
const API='https://script.google.com/macros/s/AKfycbxQ17pXtTD7_34HxAIPzzZzwfyeFRu8m1h2IA6Oy8YJvcLu2VElDYjo8ZXAqr5ON0IniA/exec';
let K=localStorage.pin||(localStorage.pin=prompt('PIN daalein')),D={products:[],parties:[]},tab='sale',cart={},
rates=JSON.parse(localStorage.rates||'{}'),today=()=>new Date().toISOString().slice(0,10);
const $=i=>document.getElementById(i),v=i=>$(i).value;
async function load(){try{D=await(await fetch(API+'?key='+K)).json();if(D.error){localStorage.removeItem('pin');alert(D.error);location.reload();return}}catch(e){alert('Internet check karein')}show()}
async function post(o){o.key=K;const r=await(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json();if(r.error){alert(r.error);return false}return true}
function nav(){const T={sale:'Sale',in:'Stock In',pay:'Wasooli',stock:'Stock'};$('nv').innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';show()">${T[k]}</button>`).join('');$('hd').textContent=T[tab]}
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
function show(){nav();const P=D.products,m=$('m');
if(tab=='sale'){m.innerHTML=`<input type="date" id="d" value="${today()}"><input id="pt" list="pl" placeholder="Party ka naam"><datalist id="pl">${opts(D.parties.map(p=>p.n))}</datalist>
<div class="grid">${P.map((p,i)=>`<button class="p ${p.s<=5?'low':''}" onclick="add(${i})">${p.n}<small>stock: ${p.s}</small></button>`).join('')}</div><div id="ct"></div>`;cartUI()}
else if(tab=='in'){m.innerHTML=`<input type="date" id="d" value="${today()}"><select id="pr">${opts(P.map(p=>p.n))}</select><input id="q" type="number" inputmode="numeric" placeholder="Qty"><input id="nt" placeholder="Note / supplier (optional)"><button class="go" onclick="stockIn()">Stock In save karein</button>`}
else if(tab=='pay'){m.innerHTML=`<input type="date" id="d" value="${today()}"><input id="pt" list="pl" placeholder="Party ka naam"><datalist id="pl">${opts(D.parties.map(p=>p.n))}</datalist><input id="am" type="number" inputmode="numeric" placeholder="Rakam"><button class="go" onclick="pay()">Wasooli save karein</button><h3>Baqi</h3>${D.parties.map(p=>`<div class="st"><span>${p.n}</span><span>${p.b}</span></div>`).join('')}`}
else m.innerHTML=P.map(p=>`<div class="st ${p.s<=5?'low':''}"><span>${p.n}</span><span>${p.s}</span></div>`).join('')}
function add(i){const n=D.products[i].n;cart[n]=cart[n]||{q:0,r:rates[n]||0};cart[n].q++;cartUI()}
function cartUI(){const ks=Object.keys(cart);let t=0;$('ct').innerHTML=ks.length?ks.map(n=>{t+=cart[n].q*cart[n].r;return`<div class="row"><b>${n}</b><input type="number" value="${cart[n].q}" onchange="upd('${n.replace(/'/g,"\\'")}','q',this.value)"><input type="number" value="${cart[n].r}" placeholder="rate" onchange="upd('${n.replace(/'/g,"\\'")}','r',this.value)"></div>`}).join('')+`<div class="tot">Total: ${t}</div><input id="pd" type="number" inputmode="numeric" placeholder="Paid (abhi mile paise)"><button class="go" onclick="sale(${t})">Sale save karein</button>`:''}
function upd(n,k,x){x=+x;if(k=='q'&&x<=0)delete cart[n];else cart[n][k]=x;cartUI()}
async function sale(t){const party=v('pt').trim();if(!party)return alert('Party ka naam likhein');
const items=Object.keys(cart).map(p=>({p,q:cart[p].q,r:cart[p].r}));
for(const i of items){const s=D.products.find(x=>x.n==i.p).s;if(i.q>s&&!confirm(i.p+': stock sirf '+s+' hai. Phir bhi save?'))return;rates[i.p]=i.r}
localStorage.rates=JSON.stringify(rates);
if(await post({type:'sale',date:v('d'),party,items,paid:+v('pd')||0})){cart={};alert('Sale save ho gayi');load()}}
async function stockIn(){if(!+v('q'))return alert('Qty likhein');if(await post({type:'in',date:v('d'),product:v('pr'),qty:+v('q'),note:v('nt')})){alert('Stock In save');load()}}
async function pay(){if(!v('pt')||!+v('am'))return alert('Party aur rakam likhein');if(await post({type:'pay',date:v('d'),party:v('pt').trim(),amount:+v('am')})){alert('Wasooli save');load()}}
load();
</script></body></html>
